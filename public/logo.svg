<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" role="img" aria-label="Raghav Mahajan — case file logo">
  <!-- Case-file folder mark. Folder + initials inherit currentColor so the
       mark works on light and dark themes; the YEG tag stays brand red. -->
  <path d="M14 42 L58 42 L70 58 L136 58 L136 128 L14 128 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
  <text x="34" y="112" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-weight="700" font-size="40" fill="currentColor">RM</text>
  <g transform="rotate(3 115 30)">
    <rect x="92" y="20" width="46" height="20" fill="#b3231b"/>
    <text x="115" y="35" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-weight="700" font-size="13" fill="#f3efe6">YEG</text>
  </g>
</svg>
